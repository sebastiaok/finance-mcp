[project]
name = "finance-mcp"
version = "0.1.0"
description = "US/KR portfolio research MCP server (learning project)"
requires-python = ">=3.10"
dependencies = [
    "fastmcp>=2.0",
    "yfinance>=0.2.40",
    "httpx>=0.27",
    "pykrx>=1.0.45",
]

[dependency-groups]
dev = ["pytest>=8.0"]

[project.scripts]
finance-mcp = "finance_mcp.server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/finance_mcp"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
